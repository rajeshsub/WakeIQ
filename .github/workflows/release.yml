name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      # Re-run the quality gate against the tagged commit before signing: a tag
      # is not proof `ci.yml` ran (or passed) against this exact commit.
      # See docs/adr/0005-gate-release-on-quality-checks.md.
      - name: Lint, format and hygiene checks (pre-commit)
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

      - name: Run unit tests
        run: ./gradlew testFullDebugUnitTest

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Build signed release APKs
        run: ./gradlew assembleFullRelease assembleFossRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      # Published alongside every release so a stranger can verify the
      # download without trusting GitHub alone. See rule 28 / README "Verifying
      # a release".
      # sha256sum records the exact path it's given as the filename inside the
      # .sha256 file; `sha256sum -c` then requires a file by that same name in
      # the verifier's working directory. GitHub Releases uploads flatten all
      # assets into one directory, so the hash must be taken with the bare
      # filename, not the build-output subdirectory path, or `sha256sum -c`
      # fails to find e.g. "full/release/app-full-release.apk" post-download.
      - name: Generate checksums
        run: |
          (cd app/build/outputs/apk/full/release && sha256sum app-full-release.apk) \
            > app/build/outputs/apk/app-full-release.apk.sha256
          (cd app/build/outputs/apk/foss/release && sha256sum app-foss-release.apk) \
            > app/build/outputs/apk/app-foss-release.apk.sha256

      - name: Upload signed APKs to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            app/build/outputs/apk/full/release/app-full-release.apk
            app/build/outputs/apk/foss/release/app-foss-release.apk
            app/build/outputs/apk/app-full-release.apk.sha256
            app/build/outputs/apk/app-foss-release.apk.sha256
          generate_release_notes: true

      - name: Clean up keystore
        if: always()
        run: rm -f keystore.jks
