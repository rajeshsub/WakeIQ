name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read prior run artifacts for the test-timing trend (rule 25 / ADR 0007)
    env:
      # `secrets` isn't a recognized context in step `if:` conditions (GitHub
      # Actions restriction) - mirror it into `env` at job level so the OWASP
      # steps below can gate on it there instead.
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # diff-cover (below) needs the merge-base with origin/main to compute
          # changed-line coverage; a shallow checkout can't see it.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Lint, format and hygiene checks (pre-commit)
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

      - name: Run unit tests
        run: ./gradlew testFullDebugUnitTest

      - name: Record test timing
        run: ./gradlew recordTestTiming

      - name: Coverage reports (Kover)
        run: >-
          ./gradlew
          koverLogFullDebug koverLogLogic
          koverHtmlReportFullDebug koverHtmlReportLogic
          koverXmlReportFullDebug koverXmlReportLogic

      - name: Enforce diff coverage on changed lines (PRs only)
        if: github.event_name == 'pull_request'
        run: |
          pip install --user diff-cover==10.5.1
          ~/.local/bin/diff-cover app/build/reports/kover/reportLogic.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=80

      - name: Cache OWASP NVD CVE database
        if: ${{ env.NVD_API_KEY != '' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .dependency-check-data
          key: owasp-nvd-data-${{ github.run_id }}
          restore-keys: owasp-nvd-data-

      # NVD's API 2.0 requires a real key to fetch CVE data at all (no
      # anonymous fallback in this plugin version, despite what an earlier
      # comment here claimed) - skip cleanly instead of failing every build
      # until NVD_API_KEY is set. See docs/adr/0006 and gaps.md.
      - name: Dependency vulnerability scan (OWASP)
        if: ${{ env.NVD_API_KEY != '' }}
        run: ./gradlew dependencyCheckAnalyze
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Warn if dependency scan was skipped
        if: ${{ env.NVD_API_KEY == '' }}
        run: |
          echo "::warning::Dependency vulnerability scan skipped - NVD_API_KEY secret not set. Get a free key at https://nvd.nist.gov/developers/request-an-api-key and add it as a repo secret."

      - name: Build debug APK
        run: ./gradlew assembleFullDebug

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-results
          path: |
            app/build/reports/lint-results-full-debug.html
            app/build/reports/detekt/
            app/build/reports/ktlint/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: app/build/reports/tests/

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-reports
          path: app/build/reports/kover/

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-check-report
          path: build/reports/dependency-check/

      - name: Upload test-timing history
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-timing
          path: benchmark-results/unit-test-timing.json
          retention-days: 90

      - name: Render test-timing trend
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          echo "## Unit test suite timing (last 10 runs on main)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| commit | timestamp | tests | duration (s) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          mkdir -p /tmp/timing-history
          run_ids=$(gh run list --workflow=ci.yml --branch=main --status=success \
            --json databaseId --jq '.[].databaseId' --limit 10 || true)

          for run_id in $run_ids; do
            gh run download "$run_id" -n test-timing -D "/tmp/timing-history/$run_id" 2>/dev/null || true
          done
          cp benchmark-results/unit-test-timing.json "/tmp/timing-history/current.json" || true

          for f in /tmp/timing-history/*/unit-test-timing.json /tmp/timing-history/current.json; do
            [ -f "$f" ] || continue
            commit=$(jq -r '.commit' "$f" | cut -c1-7)
            ts=$(jq -r '.timestamp' "$f")
            tests=$(jq -r '.testCount' "$f")
            secs=$(jq -r '.totalSeconds' "$f")
            echo "| $commit | $ts | $tests | $secs |" >> "$GITHUB_STEP_SUMMARY"
          done

  instrumented:
    name: Instrumented Tests
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: ./gradlew connectedFullDebugAndroidTest

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instrumented-test-results
          path: app/build/reports/androidTests/
