name: Dependency Vulnerability Scan

on:
  schedule:
    # Weekly, independent of any code change - catches a CVE disclosed
    # against an already-pinned/locked version. See rule 18 / ADR 0006.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    name: OWASP dependency-check (scheduled)
    runs-on: ubuntu-latest
    env:
      # `secrets` isn't a recognized context in step `if:` conditions (GitHub
      # Actions restriction) - mirror it into `env` at job level instead.
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache OWASP NVD CVE database
        if: ${{ env.NVD_API_KEY != '' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .dependency-check-data
          key: owasp-nvd-data-${{ github.run_id }}
          restore-keys: owasp-nvd-data-

      # NVD's API 2.0 requires a real key to fetch CVE data at all (no
      # anonymous fallback in this plugin version) - skip cleanly instead of
      # failing every scheduled run until NVD_API_KEY is set.
      - name: Dependency vulnerability scan (OWASP)
        if: ${{ env.NVD_API_KEY != '' }}
        run: ./gradlew dependencyCheckAnalyze
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Warn if dependency scan was skipped
        if: ${{ env.NVD_API_KEY == '' }}
        run: |
          echo "::warning::Dependency vulnerability scan skipped - NVD_API_KEY secret not set. Get a free key at https://nvd.nist.gov/developers/request-an-api-key and add it as a repo secret."

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-check-report
          path: build/reports/dependency-check/
